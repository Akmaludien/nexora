services:
  nexora-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora_password}
      POSTGRES_DB: nexora
    ports:
      - "5432:5432"
    volumes:
      - nexora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 5s
      timeout: 3s
      retries: 10

  nexora-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NEXORA_INTEGRATION_TOKEN: ${NEXORA_INTEGRATION_TOKEN:-}
      NEXORA_MCP_TOKEN: ${NEXORA_MCP_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      nexora-db:
        condition: service_healthy

volumes:
  nexora-pgdata: